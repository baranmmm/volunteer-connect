name: Task reminders

# Daily notification summary at 08:00 and task reminders at 09:00 Europe/London. GitHub cron is UTC: 07:05, 08:05 and
# 09:05 UTC cover winter and summer; the database skips runs before those London times and never sends twice a day
# (idempotent). pg_cron, when the project has it, runs the same functions; this workflow is the fallback.
# Every run also queues event reminders (2 days before) and sends queued emails within the daily limit of 300
# (transactional first, then reminders, then announcements). The later runs (13:05, 18:05 UTC) drain the outbox;
# announcements over the daily limit continue the next day.
on:
  schedule:
    - cron: '5 7,8,9,13,18 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: task-reminders-production
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create due reminders and send queued emails
        env:
          CLEANUP_CRON_SECRET: ${{ secrets.CLEANUP_CRON_SECRET }}
          # The published app (repository variable APP_URL, e.g. https://ds-volunteer.lovable.app; no trailing path).
          APP_URL: ${{ vars.APP_URL }}
        run: |
          test -n "$CLEANUP_CRON_SECRET" || { echo 'CLEANUP_CRON_SECRET is not configured'; exit 1; }
          test -n "$APP_URL" || { echo '::error::Repository variable APP_URL is empty: set it to the published app URL (Settings → Secrets and variables → Actions → Variables).'; exit 1; }
          REMINDERS_URL="${APP_URL%/}/api/public/task-reminders"
          status=$(curl --silent --show-error --max-time 300 \
            --output /tmp/reminders-result.json --write-out '%{http_code}' \
            --request POST --header "Authorization: Bearer $CLEANUP_CRON_SECRET" "$REMINDERS_URL")
          case "$status" in
            2??) cat /tmp/reminders-result.json ;;
            *) echo 'Reminders endpoint returned a non-success response'; exit 1 ;;
          esac
