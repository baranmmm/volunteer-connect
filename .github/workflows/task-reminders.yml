name: Task reminders

# Manual fallback only. pg_cron runs all of this in production: 'notification-digest' (daily summary from 08:00
# London), 'task-reminders' (from 09:00 London), 'event-reminders' (2 days before) and the minute 'outbox-flush' tick,
# which sends the emails and pushes (docs/email.md, docs/push.md). Run it by hand (Run workflow) only when pg_cron is
# down: every step is idempotent and never sends twice. It calls /api/public/task-reminders, which queues the same
# reminders and sends what the daily email limit allows.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: task-reminders-production
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create due reminders and send queued emails
        env:
          SCHEDULED_JOBS_SECRET: ${{ secrets.SCHEDULED_JOBS_SECRET }}
          # The published app (repository variable APP_URL, e.g. https://ds-volunteer.lovable.app; no trailing path).
          APP_URL: ${{ vars.APP_URL }}
        run: |
          test -n "$SCHEDULED_JOBS_SECRET" || { echo 'SCHEDULED_JOBS_SECRET is not configured'; exit 1; }
          test -n "$APP_URL" || { echo '::error::Repository variable APP_URL is empty: set it to the published app URL (Settings → Secrets and variables → Actions → Variables).'; exit 1; }
          REMINDERS_URL="${APP_URL%/}/api/public/task-reminders"
          status=$(curl --silent --show-error --max-time 300 \
            --output /tmp/reminders-result.json --write-out '%{http_code}' \
            --request POST --header "Authorization: Bearer $SCHEDULED_JOBS_SECRET" "$REMINDERS_URL")
          case "$status" in
            2??) cat /tmp/reminders-result.json ;;
            *) echo 'Reminders endpoint returned a non-success response'; exit 1 ;;
          esac
