name: Cancel superseded E2E

# A new push to a PR makes its earlier E2E (local) runs pointless: they test older code. This workflow runs at once and
# cancels the PR's earlier E2E runs, running or pending, so their runners are freed for the new run. PR runs use their
# own local Supabase stack (e2e-pr.yml), so cancelling one never leaves data anywhere.
on:
  pull_request:
    types: [synchronize, reopened]

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel earlier E2E (local) runs of this PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ids=$(gh run list -R "$REPO" --workflow e2e-pr.yml --branch "$BRANCH" --event pull_request --limit 30 \
            --json databaseId,headSha,status -q '.[] | select(.status != "completed" and .headSha != env.SHA) | .databaseId')
          if [ -z "$ids" ]; then echo "No earlier E2E run to cancel."; exit 0; fi
          for id in $ids; do echo "Cancelling E2E run $id (older commit)"; gh run cancel -R "$REPO" "$id" || true; done
