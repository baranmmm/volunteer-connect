name: Cleanup Recycle Bin

# Manual fallback only. pg_cron job 'recycle-bin-cleanup' (03:30 UTC) calls the same route in production
# (docs/event-cleanup.md). Run it by hand (Run workflow) to drain a backlog sooner or when pg_cron is down; repeat runs
# are safe.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: cleanup-deleted-events-production
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Purge expired events and users
        env:
          SCHEDULED_JOBS_SECRET: ${{ secrets.SCHEDULED_JOBS_SECRET }}
          # The published app (repository variable APP_URL, e.g. https://ds-volunteer.lovable.app; no trailing path).
          APP_URL: ${{ vars.APP_URL }}
        run: |
          test -n "$SCHEDULED_JOBS_SECRET" || { echo 'SCHEDULED_JOBS_SECRET is not configured'; exit 1; }
          test -n "$APP_URL" || { echo '::error::Repository variable APP_URL is empty: set it to the published app URL (Settings → Secrets and variables → Actions → Variables).'; exit 1; }
          CLEANUP_URL="${APP_URL%/}/api/public/cleanup-deleted-events"
          status=$(curl --silent --show-error --max-time 540 \
            --output /tmp/cleanup-result.json --write-out '%{http_code}' \
            --request POST --header "Authorization: Bearer $SCHEDULED_JOBS_SECRET" "$CLEANUP_URL")
          case "$status" in
            2??) cat /tmp/cleanup-result.json ;;
            *) echo 'Cleanup endpoint returned a non-success response'; exit 1 ;;
          esac