name: E2E (local)

# Manual only: run it on a branch before merging when the local run is not enough (Actions minutes are limited; the
# merge rule in CLAUDE.md runs @smoke + related specs locally). Each of 3 shards starts a throwaway Supabase stack on
# its own runner (e2e-local.yml: every migration, seeded users, a local TOTP authenticator for the National
# Coordinator). No QA access, no secrets, no shared database.
#
# Which tests run:
#   related   @smoke + the specs related to the branch's changes against main (e2e/scripts/select-specs.mjs).
#   full      the full suite.
on:
  # Manual only (Actions minutes). Choose the branch under "Use workflow from"; "related" = @smoke + the specs related
  # to that branch's changes against main, "full" = everything.
  workflow_dispatch:
    inputs:
      suite:
        description: "related (@smoke + specs related to the branch's changes) or full"
        type: choice
        options: [related, full]
        default: related

# A new manual run on the same branch cancels the earlier one.
concurrency:
  group: e2e-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides the suite: full, or @smoke + the specs related to this PR's changes.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.plan.outputs.run }}
      mode: ${{ steps.plan.outputs.mode }}
      grep: ${{ steps.plan.outputs.grep }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Choose the tests
        id: plan
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          echo "run=true" >> "$GITHUB_OUTPUT"
          if [ "$SUITE" = "full" ]; then
            { echo "mode=full"; echo "grep=@smoke"; echo "specs=all"; } >> "$GITHUB_OUTPUT"
            printf '### E2E selection\n\nMode: full (chosen by hand)\n' >> "$GITHUB_STEP_SUMMARY"
            node e2e/scripts/select-specs.mjs --estimate-full
          else
            node e2e/scripts/select-specs.mjs origin/main
          fi

  # The local stack, 3 shards and the merged report: shared with the nightly run (e2e-local.yml).
  e2e:
    needs: plan
    if: needs.plan.outputs.run == 'true'
    uses: ./.github/workflows/e2e-local.yml
    with:
      mode: ${{ needs.plan.outputs.mode }}
      grep: ${{ needs.plan.outputs.grep }}
